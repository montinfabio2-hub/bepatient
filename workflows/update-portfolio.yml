name: Update Portfolio Prices

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch prices
        run: python3 portfolio_update.py

      - name: Commit e push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update portfolio $(date +'%d/%m/%Y')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X ours origin main && git push && break
            echo "Retry $i..."
            sleep 5
          done
