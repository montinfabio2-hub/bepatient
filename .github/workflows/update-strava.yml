name: Update Strava Stats
 
on:
  schedule:
    - cron: '0 7 * * *'  # ogni mattina alle 9:00 ora italiana (7 UTC)
  workflow_dispatch:       # permette di lanciarlo manualmente dal sito
 
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Aggiorna km Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os, re
 
          # 1. Ottieni access token
          data = urllib.parse.urlencode({
            'client_id':     os.environ['STRAVA_CLIENT_ID'],
            'client_secret': os.environ['STRAVA_CLIENT_SECRET'],
            'refresh_token': os.environ['STRAVA_REFRESH_TOKEN'],
            'grant_type':    'refresh_token'
          }).encode()
          req = urllib.request.Request('https://www.strava.com/oauth/token', data=data)
          token_data = json.loads(urllib.request.urlopen(req).read())
          access_token = token_data['access_token']
          print(f"Token OK")
 
          # 2. Scarica tutte le attività e somma i km di corsa
          page, total_m = 1, 0
          while True:
            url = f"https://www.strava.com/api/v3/athlete/activities?per_page=100&page={page}"
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {access_token}"})
            activities = json.loads(urllib.request.urlopen(req).read())
            if not activities:
              break
            for a in activities:
              if a.get('type') == 'Run' or a.get('sport_type') == 'Run':
                total_m += a.get('distance', 0)
            page += 1
            if len(activities) < 100:
              break
 
          total_km = round(total_m / 1000, 1)
          print(f"Km totali: {total_km}")
 
          # 3. Aggiorna index.html
          with open('index.html', 'r') as f:
            html = f.read()
          html_new = re.sub(
            r'id="km-total">[0-9.,]+<',
            f'id="km-total">{total_km}<',
            html
          )
          with open('index.html', 'w') as f:
            f.write(html_new)
          print("index.html aggiornato")
          PYEOF
 
      - name: Commit e push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update km Strava $(date +'%d/%m/%Y')"
          git push
 

